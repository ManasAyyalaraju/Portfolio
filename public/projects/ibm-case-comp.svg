<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Food desert map of the DFW area with an AI analysis panel">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- map -->
  <g transform="translate(50 60)">
    <rect width="400" height="300" rx="14" fill="#111c33" stroke="#334155"/>
    <g stroke="#334155" stroke-width="2" fill="none"><path d="M0 100H400M0 200H400M100 0V300M200 0V300M300 0V300"/></g>
    <!-- tract cells: orange = low food access -->
    <g>
      <rect x="14" y="14" width="80" height="80" rx="8" fill="#38bdf8" fill-opacity=".25"/>
      <rect x="106" y="14" width="88" height="80" rx="8" fill="#38bdf8" fill-opacity=".18"/>
      <rect x="206" y="14" width="88" height="80" rx="8" fill="#f97316" fill-opacity=".75"/>
      <rect x="306" y="14" width="80" height="80" rx="8" fill="#38bdf8" fill-opacity=".25"/>
      <rect x="14" y="106" width="80" height="88" rx="8" fill="#f97316" fill-opacity=".5"/>
      <rect x="106" y="106" width="88" height="88" rx="8" fill="#38bdf8" fill-opacity=".3"/>
      <rect x="206" y="106" width="88" height="88" rx="8" fill="#f97316" fill-opacity=".9"/>
      <rect x="306" y="106" width="80" height="88" rx="8" fill="#f97316" fill-opacity=".5"/>
      <rect x="14" y="206" width="80" height="80" rx="8" fill="#38bdf8" fill-opacity=".18"/>
      <rect x="106" y="206" width="88" height="80" rx="8" fill="#f97316" fill-opacity=".6"/>
      <rect x="206" y="206" width="88" height="80" rx="8" fill="#38bdf8" fill-opacity=".3"/>
      <rect x="306" y="206" width="80" height="80" rx="8" fill="#f97316" fill-opacity=".75"/>
    </g>
    <!-- store markers -->
    <g fill="#fff"><circle cx="54" cy="54" r="5"/><circle cx="150" cy="150" r="5"/><circle cx="346" cy="54" r="5"/><circle cx="250" cy="246" r="5"/><circle cx="54" cy="246" r="5"/></g>
  </g>
  <!-- legend + panel -->
  <g transform="translate(480 60)" font-family="ui-sans-serif,system-ui">
    <rect width="270" height="190" rx="14" fill="#111c33" stroke="#334155"/>
    <text x="20" y="32" font-size="14" font-weight="700" fill="#e2e8f0">Food Desert Detection · DFW</text>
    <g font-size="12" fill="#cbd5e1">
      <rect x="20" y="56" width="14" height="14" rx="3" fill="#f97316"/><text x="44" y="68">Low food access</text>
      <rect x="20" y="82" width="14" height="14" rx="3" fill="#38bdf8" fill-opacity=".5"/><text x="44" y="94">Adequate access</text>
      <circle cx="27" cy="114" r="5" fill="#fff"/><text x="44" y="118">Grocery / food source</text>
    </g>
    <g transform="translate(20 134)"><rect width="230" height="38" rx="10" fill="#1e293b" stroke="#f97316"/>
      <text x="14" y="24" font-size="12" font-weight="700" fill="#fdba74">Watson AI · geographic + API data</text></g>
  </g>
  <g font-family="ui-sans-serif,system-ui">
    <g transform="translate(480 270)"><rect width="270" height="90" rx="14" fill="#f97316"/>
      <text x="18" y="50" font-size="34" font-weight="800" fill="#fff">+25%</text><text x="18" y="74" font-size="12" fill="#ffedd5">food desert detection accuracy</text></g>
    <text x="50" y="410" font-size="22" font-weight="800" fill="#fff">IBM Case Competition</text>
    <rect x="50" y="418" width="46" height="4" rx="2" fill="#f97316"/>
  </g>
</svg>
